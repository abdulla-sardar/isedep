<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Page - Toggle Day/Night</title>
  <style>
    :root {
      --c-bg: linear-gradient(345deg, rgb(51, 18, 58) -30%, rgb(20, 2, 33) 50%, rgb(13, 1, 22));
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--c-bg);
      overflow: hidden;
      transition: background 0.6s ease-in-out;
    }

    .container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }

    .toggle-container {
      position: relative;
      width: 150px;
      height: 80px;
    }

    .checkbox, .toggle {
      position: absolute;
    }

    .checkbox {
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 2;
      cursor: pointer;
    }

    .toggle {
      width: 100%;
      height: 100%;
      border-radius: 50px;
      background: #23243b;
      transition: all 0.4s ease-in-out;
    }

    .toggle > * {
      position: absolute;
    }

    .toggle .celestial {
      padding: 30px;
      border-radius: 50%;
      transform: translate(10px, 10px);
      background: #e7d87f;
      transition: transform 0.2s ease-in-out;
      box-shadow: 0 0 30px -10px rgba(255,255,255,0.6);
    }

    .toggle .scenery {
      padding: 2px;
      background: #f3afff;
      border-radius: 50%;
      transform: translate(100px, 15px);
      box-shadow:
        15px 10px 0px 2px #f3afff,
        10px 30px 0px 1px #bef0ff,
        25px 40px 0px 1px #f3afff;
    }

    .checkbox:checked + .toggle {
      background: #bed1ff;
    }

    .checkbox:checked + .toggle .celestial {
      background: radial-gradient(
        #ff9d00 55%,
        #ffc400 70%,
        #ffee00
      );
      transform: translate(80px, 10px);
      box-shadow: 0 0 20px 10px #ffee00;
    }

    .checkbox:checked + .toggle .scenery {
      padding: 10px 20px;
      background: #e5ecff;
      border-radius: 20px 20px 0 0;
      transform: translate(2px, 10px);
      box-shadow:
        25px 3px 0px -3px #e9e2ff,
        0px 36px 0px -4px #e9e2ff;
    }

    .nightsky {
      position: fixed;
      width: 100%;
      height: 100%;
      background: var(--c-bg);
      z-index: 0;
    }

    .overlay {
      background: rgba(51, 18, 58, 0.75);
      width: 80vw;
      height: 200px;
      border-top-left-radius: 100%;
      position: fixed;
      bottom: 0;
      right: 0;
      filter: blur(120px);
    }

    .star {
      width: 3px;
      height: 3px;
      position: absolute;
      border-radius: 100%;
      animation: twinkle 1s infinite;
    }

    #starry_sky, #starry_sky_mid, #starry_sky_back {
      position: absolute;
      top: -30%;
      left: -30%;
      width: 200vw;
      height: 200vh;
      animation: spin 200s linear infinite;
    }

    #starry_sky_mid {
      animation-duration: 400s;
    }

    #starry_sky_back {
      animation-duration: 600s;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.3); }
      50% { transform: scale(0.4); }
    }
  </style>
</head>
<body>
  <!-- خلفية -->
  <div class="nightsky">
    <div id="starry_sky"></div>
    <div id="starry_sky_mid"></div>
    <div id="starry_sky_back"></div>
    <div class="overlay"></div>
  </div>

  <!-- زر الوضع الليلي/النهاري -->
  <div class="container">
    <div class="toggle-container">
      <input class="checkbox" type="checkbox" id="checkbox" />
      <label class="toggle" for="checkbox">
        <div class="celestial"></div>
        <div class="scenery"></div>
      </label>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const bgNight = 'linear-gradient(345deg, rgb(51, 18, 58) -30%, rgb(20, 2, 33) 50%, rgb(13, 1, 22))';
    const bgDay = '#dcefff';

    const checkbox = document.getElementById('checkbox');
    checkbox.addEventListener('click', e => {
      document.documentElement.style.setProperty('--c-bg', e.target.checked ? bgDay : bgNight);
    });

    const numStars = 250;
    function randomSelect(limit) {
      return Math.floor(Math.random() * limit);
    }

    function placeStar(target, size) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.top = `${randomSelect(100)}%`;
      star.style.left = `${randomSelect(100)}%`;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.background = ['#f3afff', '#bef0ff', '#ffffff'][randomSelect(3)];
      target.appendChild(star);
    }

    function generateSky() {
      const layers = [
        document.getElementById('starry_sky_back'),
        document.getElementById('starry_sky_mid'),
        document.getElementById('starry_sky')
      ];
      layers.forEach(layer => {
        for (let i = 0; i < numStars; i++) {
          placeStar(layer, 3 + randomSelect(3));
        }
      });
    }

    document.addEventListener('DOMContentLoaded', generateSky);
  </script>
</body>
</html>
