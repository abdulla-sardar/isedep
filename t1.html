<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motherboard Simulation</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="si.css" />
</head>
<body>
  <!-- Background Canvas for the Motherboard -->
  <canvas id="motherboardCanvas"></canvas>

  <!-- Main Form for User Interaction -->
  <div class="glass-card">
    <h2>Welcome to ISE System</h2>
    <form class="form-container">
      <input type="text" class="input-field" placeholder="Full Name" />
      <input type="email" class="input-field" placeholder="Email" />
      <input type="password" class="input-field" placeholder="Password" />
      <input type="password" class="input-field" placeholder="Confirm Password" />
      <input type="text" class="input-field" placeholder="Department" />
      <button class="submit-btn">Sign Up</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 ISE System. All Rights Reserved.</p>
  </footer>

  <!-- Link to the external JavaScript file -->
  <script src="si.js"></script>
</body>
</html>
