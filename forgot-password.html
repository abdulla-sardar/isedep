<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Recovery Protocol</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Fira Code', monospace;
      background: black;
      color: #00ffcc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: -1;
      filter: blur(0.8px);
      opacity: 0.3;
    }

    .container {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #00ffcc55;
      border-radius: 16px;
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 20px #00ffccaa;
      animation: fadeIn 1.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    h2 {
      color: #00ffff;
      text-align: center;
      margin-bottom: 20px;
      animation: typing 2.5s steps(25, end) forwards;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid #00ffcc;
      width: 0;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    .warning {
      text-align: center;
      font-size: 13px;
      color: #ff6666;
      margin-bottom: 18px;
    }

    input, select {
       width: 100%;
       max-width: 100%;
       padding: 14px 16px;
       background: rgba(0,255,255,0.07);
       border: 1px solid #00ffcc55;
       border-radius: 10px;
       color: #00ffee;
       margin-bottom: 18px;
       font-family: 'Fira Code', monospace;
       font-size: 14px;
       box-sizing: border-box;
       transition: border 0.3s, box-shadow 0.3s;
}


    input:focus, select:focus {
      outline: none;
      box-shadow: 0 0 8px #1f2727aa;
      border-color: #1f5858;
    }

    select {
      appearance: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #00ffff88, #00ffaa88);
      border: none;
      border-radius: 8px;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(to right, #00ffffcc, #00ffaacc);
      transform: scale(1.03);
    }

    .link-text {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #ccc;
    }

    .link-text a {
      color: #00ffff;
      text-decoration: none;
    }

    .link-text a:hover {
      text-decoration: underline;
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      height: 2px;
      width: 100%;
      background: #00ffff44;
      box-shadow: 0 0 10px #00ffffaa;
      animation: scan 2.5s infinite ease-in-out;
    }

    @keyframes scan {
      0% { top: 0; }
      50% { top: 100%; }
      100% { top: 0; }
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="scan-line"></div>

  <div class="container">
    <h2>SECURITY RESET MODE</h2>
    <p class="warning">⚠️ Identity verification required to continue.</p>
    <form onsubmit="sendResetLink(event)">
      <input type="text" id="fullName" placeholder="Enter your full name..." required />
      <input type="email" id="email" placeholder="Enter your access email..." required />
      <select id="gender" required>
        <option value="" disabled selected>Select your gender</option>
        <option value="male">♂ Male</option>
        <option value="female">♀ Female</option>
      </select>
      <button type="submit">Initiate Recovery</button>
    </form>
    <div class="link-text">
      <p>🔙 Return to <a href="login.html">Login</a></p>
    </div>
  </div>

  <script>
    // Matrix Effect
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;

    const letters = "01∑⌐λΞΨΩ#%><⚡∆ø☠︎";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#00ffff";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }

    setInterval(drawMatrix, 35);

    async function sendResetLink(e) {
  e.preventDefault();
  const name = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const gender = document.getElementById("gender").value;

  if (!name || !email || !gender) {
    alert("⚠️ Please fill in all fields correctly.");
    return;
  }

  const formData = new FormData();
  formData.append("full_name", name);
  formData.append("email", email);
  formData.append("gender", gender);

  try {
    const response = await fetch("forgot-password-handler.php", {
      method: "POST",
      body: formData
    });

    const result = await response.text();

    document.querySelector(".container").innerHTML = `
      <h2 style="text-align:center;color:#00ffcc">🧠 Processing Complete</h2>
      <p style="text-align:center;color:lime;font-size:14px">${result}</p>
      <p class="link-text">Return to <a href="login.html">Login</a></p>
    `;
  } catch (err) {
    alert("❌ Server Error. Please try again later.");
    console.error(err);
  }
}

  </script>
</body>
</html>
