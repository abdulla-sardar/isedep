<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ISE Department</title>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans&family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Josefin Sans', sans-serif;
    }

    body {
      background: #0f0f13;
      height: 100vh;
      overflow: hidden;
    }

    canvas#background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* زر المينو الزجاجي */
    .background {
      position: fixed;
      top: 20px;
      left: 20px;
      border-radius: 16px;
      border: 1px solid #1a1a1a;
      background: rgba(74, 74, 74, 0.39);
      mix-blend-mode: luminosity;
      box-shadow: 0px 0px 0px 1px rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(15px);
      width: 65px;
      height: 65px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1001;
      cursor: pointer;
    }

    .menu__icon {
      width: 32px;
      height: 32px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .menu__icon span {
      width: 100%;
      height: 0.125rem;
      border-radius: 0.125rem;
      background-color: rgb(0, 122, 255);
      box-shadow: 0 .5px 2px 0 hsla(0, 0%, 0%, .2);
      transition: transform .4s, background-color .4s, opacity .4s;
    }

    .menu__icon:hover span:nth-child(1) {
      background-color: rgb(255, 59, 48);
      transform: translateY(11px) rotate(-45deg);
    }

    .menu__icon:hover span:nth-child(2) {
      transform: translate(-50%);
      opacity: 0;
    }

    .menu__icon:hover span:nth-child(3) {
      background-color: rgb(255, 59, 48);
      transform: translateY(-11px) rotate(45deg);
    }

    /* القائمة */
    .menu-list {
      position: fixed;
      top: 90px;
      left: 20px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 15px 20px;
      z-index: 1000;
      display: none;
      flex-direction: column;
      gap: 15px;
    }

    .menu-list.show {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .menu-list a {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.3s;
    }

    .menu-list a:hover {
      color: #03dac6;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* العنوان والرسالة */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 5;
      padding: 20px;
    }

    .center-text h1 {
      font-size: 2.5rem;
      color: #03dac6;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 2px;
    }

    .center-text p {
      color: #ffffffcc;
      font-size: 1.1rem;
      margin-top: 10px;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .center-text h1 {
        font-size: 1.8rem;
      }

      .center-text p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- الخلفية العصبية -->
  <canvas id="background"></canvas>

  <!-- زر المينو -->
  <div class="background" id="menu-btn">
    <button class="menu__icon">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- القائمة -->
  <div class="menu-list" id="menu-list">
    <a href="#"><i class="fas fa-house"></i> Home</a>
    <a href="#"><i class="fas fa-info-circle"></i> About</a>
    <a href="#"><i class="fas fa-users"></i> Staff</a>
    <a href="#"><i class="fas fa-book"></i> Courses</a>
    <a href="#"><i class="fas fa-phone"></i> Contact</a>
    <a href="#"><i class="fas fa-sign-in-alt"></i> Login</a>
    <a href="#"><i class="fas fa-user-plus"></i> Sign Up</a>
  </div>

  <!-- العنوان والرسالة -->
  <div class="center-text">
    <h1>INFORMATICS & SOFTWARE ENGINEERING</h1>
    <p>
      Welcome to the Department of Informatics and Software Engineering –<br>
      Where innovation meets technology and creativity shapes the future.
    </p>
  </div>

  <!-- Particles.js -->
  <script src="https://cdn.jsdelivr.net/npm/particlesjs@2.2.3/dist/particles.min.js"></script>
  <script>
    // الخلفية العصبية
    Particles.init({
      selector: '#background',
      color: ['#03dac6', '#ff0266'],
      maxParticles: 100,
      sizeVariations: 2,
      speed: 0.6,
      connectParticles: true,
      responsive: [
        {
          breakpoint: 768,
          options: {
            maxParticles: 40,
            connectParticles: true
          }
        }
      ]
    });

    // المينو
    const menuBtn = document.getElementById('menu-btn');
    const menuList = document.getElementById('menu-list');

    let isMobile = window.innerWidth <= 768;

    menuBtn.addEventListener('click', () => {
  if (isMobile) {
    menuList.classList.toggle('show');
  }
});

// لما تضغط برة الزر والقائمة، تسده تلقائيًا
document.addEventListener('click', function(e) {
  if (isMobile) {
    if (!menuBtn.contains(e.target) && !menuList.contains(e.target)) {
      menuList.classList.remove('show');
    }
  }
});


    // كمبيوتر: إظهار عند hover على الزر أو القائمة
    if (!isMobile) {
      menuBtn.addEventListener('mouseenter', () => menuList.classList.add('show'));
      menuList.addEventListener('mouseenter', () => menuList.classList.add('show'));
      menuBtn.addEventListener('mouseleave', () => {
        setTimeout(() => {
          if (!menuList.matches(':hover')) menuList.classList.remove('show');
        }, 200);
      });
      menuList.addEventListener('mouseleave', () => menuList.classList.remove('show'));
    }

    // تحديث عند تغيير حجم الشاشة
    window.addEventListener('resize', () => {
      isMobile = window.innerWidth <= 768;
      menuList.classList.remove('show');
    });
  </script>
</body>
</html>
