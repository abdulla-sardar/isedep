<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
  --accent-color: #00ff99; /* اللون الافتراضي */
}

    body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: black;
  font-family: 'Fira Code', monospace;
  display: flex;
  justify-content: center;
}




    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -3;
    }

    .floating-message {
      position: absolute;
      color: #00ff99;
      font-size: 14px;
      animation: floatMsg 8s ease-in-out infinite;
      opacity: 0;
    }

    @keyframes floatMsg {
      0% { opacity: 0; transform: translateY(0); }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-20px); }
    }

    .glass-card {
  background: rgba(0, 0, 0, 0.4);
  border-radius: 16px;
  backdrop-filter: blur(14px);
  padding: 30px 25px;
  width: 100%;
  max-width: 400px;
  animation: fadeIn 0.8s ease-out forwards;
  z-index: 1;
  border: 1px solid var(--accent-color);
  box-shadow: 0 0 30px var(--accent-color);
  color: var(--accent-color);
}



    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }

    .glass-card h2 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 22px;
      color: var(--accent-color);
      animation: slideDown 1s ease forwards;
    }

    .glass-card p {
      text-align: center;
      font-size: 13px;
      color: #ccc;
      margin-bottom: 20px;
      animation: slideUp 1s ease forwards;
    }

    @keyframes slideDown {
      0% { transform: translateY(-20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes slideUp {
      0% { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .input-field, select {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 12px;
      width: 100%;
      margin-bottom: 16px;
      color: rgb(121, 119, 119);
      font-family: inherit;
      transition: border 0.3s, box-shadow 0.3s;
      box-sizing: border-box;
    }

    .input-field:focus {
      outline: none;
      border: 1px solid var(--accent-color);;
      box-shadow: 0 0 5px var(--accent-color);;
    }

    .input-field.valid {
      border-color: limegreen;
    }

    .input-field.invalid {
      border-color: red;
    }

    .password-container {
      position: relative;
      margin-bottom: 10px;
    }

    .password-container input {
      width: 100%;
      padding-right: 44px;
    }

    .toggle-password-button {
      position: absolute;
      top: 35%;
      right: 12px;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .toggle-password-button i {
      color: var(--accent-color);
      font-size: 20px;
      transition: transform 0.3s;
    }

    .password-strength {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 4px;
      font-family: 'Fira Code', monospace;
    }

    .password-warning {
      font-size: 12px;
      color: orange;
      font-style: italic;
      margin-bottom: 16px;
      font-family: 'Fira Code', monospace;
    }

    .strength-weak { color: red; }
    .strength-medium { color: orange; }
    .strength-strong { color: #00ff99; }
    .strength-very-strong { color: cyan; }

    .signup-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, var(--accent-color), #00ffff);
      border: none;
      border-radius: 8px;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .signup-btn:hover {
      background: linear-gradient(to right, var(--accent-color), #00cccc);
      transform: scale(1.02);
    }

    .shake {
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }
    .gender-icon {
  width: 100px;
  border: 2px solid transparent;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.3s ease;
  filter: grayscale(70%);
}

.gender-icon:hover {
  filter: grayscale(0%);
  transform: scale(1.05);
}

.gender-icon.selected {
  border-color: #00ff99;
  filter: grayscale(0%);
  box-shadow: 0 0 12px #00ff99aa;
}
.toast-message {
  background: rgba(0, 0, 0, 0.85);
  color: #00ff99;
  padding: 16px 28px;
  border-radius: 14px;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 15px;
  font-family: 'Fira Code', monospace;
  box-shadow: 0 0 25px #00ff99aa;
  z-index: 9999;
  border: 1px solid #00ff99;
  animation: fadeInOut 3s ease-in-out forwards;
  text-align: center;
  letter-spacing: 0.5px;
}

@keyframes fadeInOut {
  0% { opacity: 0; transform: translate(-50%, -60%); }
  10% { opacity: 1; transform: translate(-50%, -50%); }
  90% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -40%); }
}


@keyframes motherboard-lines {
  0% { background-position: 0 0; }
  100% { background-position: 40px 40px; }
}
/* مستويات التقدم حسب عدد الحقول المملوءة */
.glass-card.step-1::before { opacity: 0.1; }
.glass-card.step-2::before { opacity: 0.18; }
.glass-card.step-3::before { opacity: 0.26; }
.glass-card.step-4::before { opacity: 0.34; }
.glass-card.step-5::before { opacity: 0.42; }
.glass-card.step-6::before { opacity: 0.50; }
.glass-card.step-7::before { opacity: 0.65; }

/* عند إكمال كل الحقول */
.glass-card.complete {
  box-shadow: 0 0 30px #00ff99aa, inset 0 0 10px #00ff9955;
  border: 1px solid #00ff99;
}
.glass-card.scanning::after {
  content: '';
  position: absolute;
  top: -100%;
  left: 0;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    to bottom,
    transparent,
    #00ff9955 5px,
    transparent 10px
  );
  animation: scanEffectY 1.5s forwards;
  pointer-events: none;
  z-index: 0;
  border-radius: 16px;
}

@keyframes scanEffectY {
  to {
    top: 100%;
  }
}


.user-id-card {
  margin-top: 35px;
  padding: 15px 20px;
  border-radius: 14px;
  background: linear-gradient(135deg, #0f0f0f, #1a1a1a);

.user-id-card .chip {

  background: repeating-linear-gradient(

.user-id-card .user-data {

.user-id-card .id-label {

}

@keyframes fadeInCard {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}
.center-wrapper {
  display: flex;
  flex-direction: column;

  justify-content: center;

.glass-card.student-theme {

.glass-card.teacher-theme {

/* ألوان خاصة لكل دور */
.glass-card.student-theme {

}
.glass-card.teacher-theme {

.back-home-btn {
  display: block;
  margin-top: 20px;
  padding: 12px 20px;
  background: linear-gradient(to right, #00ffffaa, #00ffaaaa);
  color: black;
  font-weight: bold;

  <script>
    // Toggle password visibility
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const icon = document.getElementById('toggleIcon');
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      icon.className = isHidden ? 'fas fa-lock' : 'fas fa-eye';
    }

    // Email validation
    const emailInput = document.getElementById('email');
    emailInput.addEventListener("input", () => {
      const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value);
      emailInput.classList.toggle("valid", valid);
      emailInput.classList.toggle("invalid", !valid);
    });

    // Password strength
    const passwordInput = document.getElementById("password");
    const strengthText = document.getElementById("strength-text");
    const warningText = document.getElementById("warning-text");
    const submitBtn = document.getElementById("submitBtn");

    passwordInput.addEventListener("input", () => {
      const value = passwordInput.value;
      const strength = checkStrength(value);
      updateStrengthText(strength);
    });

    function checkStrength(password) {
      let score = 0;
      if (password.length >= 8) score++;
      if (/[A-Z]/.test(password)) score++;
      if (/[0-9]/.test(password)) score++;
      if (/[^A-Za-z0-9]/.test(password)) score++;
      if (password.length >= 12) score++;
      return score;
    }

    function updateStrengthText(score) {
      strengthText.className = "password-strength";
      warningText.textContent = "";
      const icon = document.getElementById("toggleIcon");

      if (score === 0) {
        strengthText.textContent = "Strength: —";
        icon.className = "fas fa-eye";
      } else if (score <= 2) {
        strengthText.textContent = "Strength: Weak 🔴";
        strengthText.classList.add("strength-weak");
        warningText.textContent = "😅 You'll get hacked before you even finish signing up!";
        icon.className = "fas fa-eye";
      } else if (score === 3) {
        strengthText.textContent = "Strength: Medium 🟠";
        strengthText.classList.add("strength-medium");
        warningText.textContent = "🕵️‍♂️ Hackers are laughing at this password.";
        icon.className = "fas fa-eye";
      } else if (score === 4) {
        strengthText.textContent = "Strength: Strong 🟢";
        strengthText.classList.add("strength-strong");
        warningText.textContent = "✅ That's a solid password! Almost there!";
        icon.className = "fas fa-lock-open";
      } else {
        strengthText.textContent = "Strength: Very Strong 💚";
        strengthText.classList.add("strength-very-strong");
        warningText.textContent = "💪 Excellent! Your password is hacker-proof!";
        icon.className = "fas fa-lock";
      }
    }

    // Shake button if weak
    function validateForm() {
      const strength = checkStrength(passwordInput.value);
      if (strength <= 2) {
        submitBtn.classList.add("shake");
        setTimeout(() => submitBtn.classList.remove("shake"), 500);
        return false;
      }
      return true;
    }

    // Matrix effect
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;
    const letters = '01&@#*<>|{}[]()MatrixFutureAIデータ分析علمبيانات';
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#' + Math.floor(Math.random()*16777215).toString(16);
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 40);

    function validateForm() {
  const strength = checkStrength(passwordInput.value);
  const confirmPassword = document.getElementById("confirm-password").value;

  if (strength <= 2) {
    submitBtn.classList.add("shake");
    setTimeout(() => submitBtn.classList.remove("shake"), 500);
    return false;
  }

  if (passwordInput.value !== confirmPassword) {
    warningText.textContent = "❗ Passwords do not match.";
    return false;
  }

  return true;
}
const confirmPasswordInput = document.getElementById("confirm-password");
const matchWarning = document.getElementById("match-warning");

confirmPasswordInput.addEventListener("input", () => {
  const passVal = passwordInput.value;
  const confirmVal = confirmPasswordInput.value;

  if (!confirmVal) {
    matchWarning.textContent = "";
  } else if (confirmVal === passVal) {
    matchWarning.textContent = "✅ Passwords match!";
    matchWarning.style.color = "#00ff99";
  } else if (passVal.startsWith(confirmVal)) {
    matchWarning.textContent = "⚠️ Almost there...";
    matchWarning.style.color = "orange";
  } else {
    matchWarning.textContent = "❌ Still way off...";
    matchWarning.style.color = "red";
  }
});
function confirmRevealBlocked() {
  const msg = document.getElementById("confirm-block-msg");
  msg.textContent = "❌ Nice try! Confirm password must be typed manually 😎";
  msg.style.color = "orange";
  msg.style.fontStyle = "italic";

  setTimeout(() => {
    msg.textContent = "";
  }, 5000);
}
function selectGender(gender) {
  document.getElementById("gender").value = gender;
  const msg = document.getElementById("gender-message");

  const maleImg = document.getElementById("male-img");
  const femaleImg = document.getElementById("female-img");

  // Reset الشكل
  maleImg.classList.remove("selected");
  femaleImg.classList.remove("selected");

  // تحديد الجنس وتغيير الرسالة
  if (gender === "male") {
    msg.textContent = " Welcome, sir. Your journey in software engineering begins now.";
    maleImg.classList.add("selected");
  } else if (gender === "female") {
    msg.textContent = " Welcome, lady. The world of code awaits your brilliance.";
    femaleImg.classList.add("selected");
  }
  updateCardProgress();
}

async function validateForm() {
  const name = document.querySelector('input[placeholder="Full Name"]').value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirm-password").value;
  const selectedGender = document.getElementById("gender").value;
  const role = document.querySelector('select.input-field').value;
  const department = document.querySelector('input[placeholder*="Department"]').value.trim();
  const strength = checkStrength(password);
  const submitBtn = document.getElementById("submitBtn");

  if (!name) return showToast("📝 Please enter your full name.");
  if (!email) return showToast("📧 Please enter your email.");
  if (!password) return showToast("🔒 Please enter a password.");
  if (strength <= 2) return showToast("⚠️ Your password is too weak.");
  if (!confirmPassword) return showToast("🔁 Please confirm your password.");
  if (password !== confirmPassword) return showToast("❌ Passwords do not match.");
  if (!selectedGender) return showToast("🚻 Please select your gender.");
  if (!role) return showToast("👤 Please select your role.");
  if (!department) return showToast("🏢 Please enter your department.");

  updateCardProgress();

  // زر يتحول إلى Loading
  document.getElementById("btn-text").textContent = "Loading...";
  submitBtn.disabled = true;

  // تأثير الـ Scan
  const card = document.querySelector('.glass-card');
  card.classList.add('scanning');
  setTimeout(() => card.classList.remove('scanning'), 1600);

  // إرسال البيانات إلى السيرفر
  const formData = new FormData();
  formData.append('full_name', name);
  formData.append('email', email);
  formData.append('password', password);
  formData.append('role', role);
  formData.append('department', department);
  formData.append('gender', selectedGender);

  try {
    const response = await fetch("register.php", {
      method: "POST",
      body: formData
    });

    const result = await response.text();

    // زر يتحول إلى ✔ Done!
    document.getElementById("btn-text").textContent = "✔ Done!";
    submitBtn.style.background = "linear-gradient(to right, limegreen, #00ff99)";

    // إظهار رسالة ترحيب إذا تمت العملية بنجاح
setTimeout(() => {
  document.querySelector(".center-wrapper").innerHTML = `
    <h2 style="color: #00ff99; font-family: 'Fira Code', monospace; font-size: 20px; text-align: center; margin-top: 40px;">
      🎉 Welcome, <span style="color: cyan;">${name}</span>!<br>
      ${result.includes("success") || result.includes("✅") ? "You are now part of the ISE system 🌐" : result}
    </h2>
  `;

  // ⏩ تحويل تلقائي إلى صفحة تسجيل الدخول
  setTimeout(() => {
    window.location.href = "login.html";
  }, 3000);

}, 1800);


  } catch (error) {
    showToast("❌ Error while registering. Try again later.");
    console.error("Registration error:", error);
    submitBtn.disabled = false;
    document.getElementById("btn-text").textContent = "Sign Up";
  }

  return false; // حتى ما يعيد تحميل الصفحة
}


function showToast(message) {
  const existing = document.querySelector('.toast-message');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'toast-message';
  toast.textContent = message;
  document.body.appendChild(toast);

  setTimeout(() => {
    toast.remove();
  }, 3000);
}
function updateCardProgress() {
  const card = document.querySelector('.glass-card');
  const fields = [
    document.querySelector('input[placeholder="Full Name"]'),
    document.getElementById("email"),
    document.getElementById("password"),
    document.getElementById("confirm-password"),
    document.getElementById("gender"),
    document.querySelector('select.input-field'),
    document.querySelector('input[placeholder*="Department"]')
  ];

  const filled = fields.filter(f => f && f.value.trim()).length;

  card.classList.remove(
    "step-1", "step-2", "step-3", "step-4",
    "step-5", "step-6", "step-7", "complete"
  );
  if (filled > 0 && filled <= 7) card.classList.add(`step-${filled}`);
  if (filled === fields.length) card.classList.add("complete");

  // بطاقة الهوية
  const preview = document.getElementById("user-preview");
  if (filled >= 4 && preview) {
    preview.style.display = "flex";
    preview.classList.add("fade-in");
    preview.querySelector("#preview-name").textContent = fields[0].value || "-";
    preview.querySelector("#preview-role").textContent = fields[5].value || "-";
    preview.querySelector("#preview-dept").textContent = fields[6].value || "-";
    preview.querySelector("#preview-gender").textContent = fields[4].value || "-";
  } else {
    preview.style.display = "none";
  }

  // 🎨 تغيير ألوان الكارت حسب الدور
  card.classList.remove("student-theme", "teacher-theme", "guest-theme");
  if (fields[5].value === "student") {
    card.classList.add("student-theme");
  } else if (fields[5].value === "teacher") {
    card.classList.add("teacher-theme");
  } else if (fields[5].value === "guest") {
    card.classList.add("guest-theme");
  }
}



// كل الحقول العادية (نص، إيميل، الخ)
document.querySelectorAll('.input-field').forEach(input => {
  input.addEventListener('input', updateCardProgress);
});

// ربط تغيير اختيار الجنس (radio أو hidden)
document.getElementById("gender")?.addEventListener('change', updateCardProgress);

// تشغيلها مرة عند تحميل الصفحة
updateCardProgress();
document.querySelector('select.input-field').addEventListener('change', (e) => {
  const role = e.target.value;
  const root = document.documentElement;

  if (role === "student") {
    root.style.setProperty('--accent-color', '#00ff99');
  } else if (role === "teacher") {
    root.style.setProperty('--accent-color', '#00ccff');
  } else if (role === "guest") {
    root.style.setProperty('--accent-color', '#cc66ff');
  }

  updateCardProgress(); // حتى تتحدث البطاقة التعريفية
});

  </script>
</body>
</html>
